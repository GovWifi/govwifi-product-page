# PostgreSQL. Versions 9.5 and up are supported.
#
# Docker-compose provides a `DATABASE_URL` in dev/test; Rails merges it
# over these defaults automatically (see comment near production block).

default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "chatbot_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "chatbot_test") %>

# Production is driven entirely by DATABASE_URL from the platform.
production:
  <<: *default
  database: chatbot_production
  url: <%= ENV["DATABASE_URL"] %>
