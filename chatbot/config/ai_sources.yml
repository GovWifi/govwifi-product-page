# Registered documentation sources for the RAG index.
#
# Paths are resolved relative to Rails.root (chatbot/); absolute paths
# work too. Phase 2 sources are commented out — uncomment to include.
# Source ranking is applied at retrieval time via Document#source_priority.

sources:
  - source_type: product-page
    root: "../source"
    url_prefix: "https://www.wifi.service.gov.uk"

  # Phase 2 — uncomment when the retrieval quality has been evaluated
  # on product-page alone:
  #
  # - source_type: tech-docs
  #   root: "../../govwifi-tech-docs/source"
  #   url_prefix: "https://docs.wifi.service.gov.uk"
  #
  # - source_type: dev-docs
  #   root: "../../govwifi-dev-docs/source"
  #   url_prefix: "https://dev-docs.wifi.service.gov.uk"

skip_patterns:
  - "_*.erb"           # Middleman partials
  - "**/layouts/**"    # Middleman layouts
  - "**/shared/**"     # Middleman shared partials
  - "**/javascripts/**"
  - "**/stylesheets/**"
  - "**/images/**"
  - "**/assets/**"
  - "sitemap.xml*"
  - "**/*.xml.erb"
  - "**/*.scss"
  - "**/*.css"
  - "**/*.js"
  - "**/*.svg"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
